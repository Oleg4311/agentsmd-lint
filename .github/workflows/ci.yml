name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Форматирование
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Clippy без предупреждений
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
        env:
          PROPTEST_CASES: "3000"

  # Минимальная поддерживаемая версия Rust собирает библиотеку и CLI
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.82 --profile minimal
      - run: cargo +1.82 build --locked

  # Собранный бинарник проверяет сам себя и демонстрационный репозиторий
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build --release
      - name: Собственные инструкции без замечаний (уровень предупреждений)
        run: ./target/release/agentsmd-lint . --fail-on warning
      - name: Демонстрационный репозиторий даёт ошибки и код выхода 1
        run: |
          if ./target/release/agentsmd-lint examples/demo --format sarif > demo.sarif; then echo "ожидался код 1"; exit 1; fi
          node -e "const s=JSON.parse(require('fs').readFileSync('demo.sarif','utf8')); if(s.version!=='2.1.0'||s.runs[0].results.length<8) process.exit(1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-sarif
          path: demo.sarif
