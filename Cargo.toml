[package]
name = "agentsmd-lint"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Линтер файлов-инструкций для ИИ-агентов (AGENTS.md, CLAUDE.md и др.): сверяет написанное с реальным репозиторием"
license = "MIT"
repository = "https://github.com/Oleg4311/agentsmd-lint"
readme = "README.md"
keywords = ["agents", "lint", "claude", "agents-md", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "agentsmd_lint"
path = "src/lib.rs"

[[bin]]
name = "agentsmd-lint"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
